<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAF8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="robots" content="noindex" />
    <title>404 | Takumi Tokunaga</title>
    <style>
      :root {
        color: #1f2428;
        background: #fafaf8;
        font-family:
          Inter,
          "Noto Sans JP",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        box-sizing: border-box;
      }

      section {
        width: min(100%, 720px);
      }

      h1 {
        margin: 0 0 16px;
        font-size: 2rem;
        line-height: 1.25;
      }

      p {
        margin: 0 0 24px;
        color: #5b646b;
        line-height: 1.8;
      }

      a {
        color: #0e6f6a;
        font-weight: 800;
      }

      a:focus-visible {
        outline: 3px solid #b33a3a;
        outline-offset: 3px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color: #f2f6f4;
          background: #000000;
        }

        p {
          color: #b8c4bf;
        }

        a {
          color: #64c7bd;
        }

        a:focus-visible {
          outline-color: #f08a8a;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>ページが見つかりません</h1>
        <p>指定されたページは存在しないか、URLが変更されています。</p>
        <a href="/">トップへ戻る</a>
      </section>
    </main>
  </body>
</html>
