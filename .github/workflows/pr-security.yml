name: PR Security

on:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pr-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_js: ${{ steps.detect.outputs.has_js }}
      has_go: ${{ steps.detect.outputs.has_go }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then echo "has_js=true" >> "$GITHUB_OUTPUT"; else echo "has_js=false" >> "$GITHUB_OUTPUT"; fi
          if git ls-files | grep -Eq '(^|/)go\.mod$'; then echo "has_go=true" >> "$GITHUB_OUTPUT"; else echo "has_go=false" >> "$GITHUB_OUTPUT"; fi

  codeql-javascript:
    name: CodeQL (JavaScript/TypeScript)
    needs: detect
    if: ${{ needs.detect.outputs.has_js == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4

  codeql-go:
    name: CodeQL (Go)
    needs: detect
    if: ${{ needs.detect.outputs.has_go == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: go
      - uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Run Semgrep
        run: |
          python -m pip install --upgrade pip semgrep
          semgrep scan --config auto --error

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@f6a2a647e42a41cd71b1d622a91c8e7f985c6ca2 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Test / Type Check / Build
    needs: detect
    if: ${{ needs.detect.outputs.has_js == 'true' || needs.detect.outputs.has_go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: ${{ needs.detect.outputs.has_js == 'true' }}
        with:
          node-version: 24
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: ${{ needs.detect.outputs.has_go == 'true' }}
        with:
          go-version: "1.26.4"
      - name: Install JS dependencies
        if: ${{ needs.detect.outputs.has_js == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            corepack prepare pnpm@11.0.8 --activate
            pnpm install --frozen-lockfile
            echo "JS_PM=pnpm" >> "$GITHUB_ENV"
          elif [ -f package-lock.json ]; then npm ci; echo "JS_PM=npm" >> "$GITHUB_ENV"; else npm install; echo "JS_PM=npm" >> "$GITHUB_ENV"; fi
      - name: npm audit
        if: ${{ needs.detect.outputs.has_js == 'true' }}
        run: if [ "$JS_PM" = pnpm ]; then pnpm audit; else npm audit; fi
      - name: ESLint
        if: ${{ needs.detect.outputs.has_js == 'true' }}
        run: if [ "$JS_PM" = pnpm ]; then pnpm run lint; else npm run lint; fi
      - name: Type Check
        if: ${{ needs.detect.outputs.has_js == 'true' }}
        run: if [ "$JS_PM" = pnpm ]; then pnpm run typecheck; else npm run typecheck; fi
      - name: Unit tests
        if: ${{ needs.detect.outputs.has_js == 'true' }}
        run: if [ "$JS_PM" = pnpm ]; then pnpm run test:unit; else npm run test:unit; fi
      - name: Build and check performance budgets
        if: ${{ needs.detect.outputs.has_js == 'true' }}
        run: if [ "$JS_PM" = pnpm ]; then pnpm run build && pnpm run budget; else npm run build && npm run budget; fi
      - name: Go test, vet, vulncheck, build
        if: ${{ needs.detect.outputs.has_go == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck_bin="$(go env GOPATH)/bin/govulncheck"
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            if [ "$dir" = . ]; then
              mapfile -t go_files < <(git ls-files -- '*.go')
            else
              mapfile -t go_files < <(git ls-files -- "$dir" | grep -E '\.go$' || true)
            fi
            if [ "${#go_files[@]}" -gt 0 ]; then
              unformatted="$(gofmt -l "${go_files[@]}")"
              if [ -n "$unformatted" ]; then
                echo "::error::gofmt required for ${unformatted}"
                exit 1
              fi
            fi
            [ "$dir" = . ] || pushd "$dir" >/dev/null
            go vet ./...; go test ./...; "$govulncheck_bin" ./...; go build ./...
            [ "$dir" = . ] || popd >/dev/null
          done < <(git ls-files | grep -E '(^|/)go\.mod$' | grep -vE '(^|/)vendor/')

  claude-security-review:
    name: Claude Security Reviewer
    # Never use pull_request_target here. The API key is released only after
    # GitHub Environment protection, and only for a PR authored by the owner.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    environment: claude-security-review
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Require Claude API key
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: test -n "$CLAUDE_API_KEY"
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main 2026-06-08
        with:
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          comment-pr: true
