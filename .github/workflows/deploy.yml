name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PORTFOLIO_SITE_ORIGIN: https://takumi-tokunaga.com
  PROJECT_NAME: takumi-tokunaga
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_TRIAL_AUTH_API_ORIGIN: ${{ vars.VITE_TRIAL_AUTH_API_ORIGIN }}

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Build the deployment artifact
        run: pnpm build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      - name: Check performance budgets
        run: pnpm budget
      - name: Accessibility tests
        run: pnpm test:a11y
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          PORTFOLIO_USE_EXISTING_BUILD: "1"
      - name: Lighthouse
        run: pnpm a11y:lighthouse
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          PORTFOLIO_USE_EXISTING_BUILD: "1"
      - name: Upload tested site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portfolio-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-diagnostics
          path: |
            playwright-report
            test-results
            .accessibility-reports/lighthouse
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy tested artifact
    runs-on: ubuntu-latest
    needs: build
    # Direct Upload production is restricted to main, including a manually
    # dispatched run that explicitly selects the main ref.
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      deployments: write
    env:
      CF_PAGES_BRANCH: main
    steps:
      - name: Checkout only to install the pinned Wrangler dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install pinned Wrangler dependency
        run: pnpm install --frozen-lockfile
      - name: Download tested site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: portfolio-dist
          path: dist
      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist --project-name="$PROJECT_NAME" --branch="$CF_PAGES_BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    name: Smoke test production
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Check public routes with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          scratch_dir="$(mktemp -d)"
          trap 'rm -rf "$scratch_dir"' EXIT

          verify_response() {
            local route="$1" headers="$2" body="$3"
            case "$route" in
              /)
                grep -Eqi '^content-type:.*text/html' "$headers" &&
                  grep -Fq '<title>徳永拓未 | Takumi Tokunaga Portfolio</title>' "$body" &&
                  grep -Fq '<link rel="canonical" href="https://takumi-tokunaga.com/"' "$body" &&
                  grep -Fq 'Takumi Tokunaga' "$body"
                ;;
              /experience/rione/)
                grep -Eqi '^content-type:.*text/html' "$headers" &&
                  grep -Fq '<title>Ri-one | Takumi Tokunaga</title>' "$body" &&
                  grep -Fq '<link rel="canonical" href="https://takumi-tokunaga.com/experience/rione/"' "$body" &&
                  grep -Fq 'Ri-one' "$body"
                ;;
              /en/experience/rione/)
                grep -Eqi '^content-type:.*text/html' "$headers" &&
                  grep -Fq '<title>Ri-one | Takumi Tokunaga</title>' "$body" &&
                  grep -Fq '<link rel="canonical" href="https://takumi-tokunaga.com/en/experience/rione/"' "$body" &&
                  grep -Fq 'Ri-one' "$body"
                ;;
              /robots.txt)
                grep -Eqi '^content-type:.*(text/plain|text/)' "$headers" &&
                  grep -Fq 'User-agent: *' "$body" &&
                  grep -Fq 'Sitemap: https://takumi-tokunaga.com/sitemap.xml' "$body"
                ;;
              /sitemap.xml)
                grep -Eqi '^content-type:.*(application/xml|text/xml)' "$headers" &&
                  grep -Fq '<urlset ' "$body" &&
                  grep -Fq '<loc>https://takumi-tokunaga.com/</loc>' "$body"
                ;;
            esac
          }

          routes=(/ /experience/rione/ /en/experience/rione/ /robots.txt /sitemap.xml)
          for route in "${routes[@]}"; do
            url="${PORTFOLIO_SITE_ORIGIN}${route}"
            echo "Checking ${url}"
            for attempt in 1 2 3 4 5; do
              headers="${scratch_dir}/headers-${attempt}"
              body="${scratch_dir}/body-${attempt}"
              if curl --fail --silent --show-error --location --max-time 20 --dump-header "$headers" --output "$body" "$url" &&
                verify_response "$route" "$headers" "$body"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Production smoke check failed for ${url}"
                exit 1
              fi
              sleep $((attempt * 3))
            done
          done
