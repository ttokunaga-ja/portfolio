name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PORTFOLIO_SITE_ORIGIN: https://takumi-tokunaga.com
  PROJECT_NAME: takumi-tokunaga
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_TRIAL_AUTH_API_ORIGIN: ${{ vars.VITE_TRIAL_AUTH_API_ORIGIN }}

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Build the deployment artifact
        run: pnpm build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      - name: Reject retired asset references
        shell: bash
        run: |
          set -euo pipefail
          retired_asset_names=(
            'rione_expo_pass'
            'marugame-kyudo-club_farewell'
          )
          for retired_asset_name in "${retired_asset_names[@]}"; do
            if rg --hidden --ignore-case --fixed-strings "$retired_asset_name" content public dist src/generated; then
              echo "::error::Retired asset '${retired_asset_name}' remains in deployable content"
              exit 1
            fi
          done
      - name: Check performance budgets
        run: pnpm budget
      - name: Accessibility tests
        run: pnpm test:a11y
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          PORTFOLIO_USE_EXISTING_BUILD: "1"
      - name: Lighthouse
        run: pnpm a11y:lighthouse
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          PORTFOLIO_USE_EXISTING_BUILD: "1"
      - name: Upload tested site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portfolio-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-diagnostics
          path: |
            playwright-report
            test-results
            .accessibility-reports/lighthouse
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy tested artifact
    runs-on: ubuntu-latest
    needs: build
    # Direct Upload production is restricted to main, including a manually
    # dispatched run that explicitly selects the main ref.
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      deployments: write
    outputs:
      deployment-url: ${{ steps.cloudflare-deploy.outputs.deployment-url }}
    env:
      CF_PAGES_BRANCH: main
    steps:
      - name: Checkout only to install the pinned Wrangler dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install pinned Wrangler dependency
        run: pnpm install --frozen-lockfile
      - name: Download tested site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: portfolio-dist
          path: dist
      - name: Deploy to Cloudflare Pages
        id: cloudflare-deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-diagnostics
          pnpm exec wrangler pages deploy dist --project-name="$PROJECT_NAME" --branch="$CF_PAGES_BRANCH" 2>&1 | tee deploy-diagnostics/wrangler-output.txt
          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev[^[:space:]]*' deploy-diagnostics/wrangler-output.txt | tail -n 1 || true)"
          printf 'github_sha=%s\ndeployment_url=%s\n' "$GITHUB_SHA" "$deployment_url" > deploy-diagnostics/summary.txt
          printf 'deployment-url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload deployment diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deployment-diagnostics
          path: deploy-diagnostics
          if-no-files-found: warn
          retention-days: 7

  smoke:
    name: Smoke test production
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ github.ref == 'refs/heads/main' }}
    env:
      DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment-url }}
    steps:
      - name: Check public routes with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          scratch_dir="$(mktemp -d)"
          trap 'rm -rf "$scratch_dir"' EXIT
          mkdir -p smoke-diagnostics
          printf 'github_sha=%s\ndeployment_url=%s\n' "$GITHUB_SHA" "$DEPLOYMENT_URL" > smoke-diagnostics/summary.txt

          verify_response() {
            local route="$1" headers="$2" body="$3"
            case "$route" in
              /)
                grep -Eqi '^content-type:.*text/html' "$headers" &&
                  grep -Fq '<title>徳永拓未 | Takumi Tokunaga Portfolio</title>' "$body" &&
                  grep -Fq '<link rel="canonical" href="https://takumi-tokunaga.com/"' "$body" &&
                  grep -Fq 'Takumi Tokunaga' "$body"
                ;;
              /experience/rione/)
                grep -Eqi '^content-type:.*text/html' "$headers" &&
                  grep -Fq '<title>Ri-one | Takumi Tokunaga</title>' "$body" &&
                  grep -Fq '<link rel="canonical" href="https://takumi-tokunaga.com/experience/rione/"' "$body" &&
                  grep -Fq 'Ri-one' "$body" &&
                  ! grep -Fq 'rione_expo_pass.JPG' "$body"
                ;;
              /en/experience/rione/)
                grep -Eqi '^content-type:.*text/html' "$headers" &&
                  grep -Fq '<title>Ri-one | Takumi Tokunaga</title>' "$body" &&
                  grep -Fq '<link rel="canonical" href="https://takumi-tokunaga.com/en/experience/rione/"' "$body" &&
                  grep -Fq 'Ri-one' "$body" &&
                  ! grep -Fq 'rione_expo_pass.JPG' "$body"
                ;;
              /experience/marugame-kyudo-club/)
                grep -Eqi '^content-type:.*text/html' "$headers" &&
                  grep -Fq '<title>香川県立丸亀高等学校 弓道部 | Takumi Tokunaga</title>' "$body" &&
                  grep -Fq '<link rel="canonical" href="https://takumi-tokunaga.com/experience/marugame-kyudo-club/"' "$body" &&
                  grep -Fq 'marugame-kyudo-club_practice.jpg' "$body" &&
                  ! grep -Fq 'marugame-kyudo-club_farewell' "$body"
                ;;
              /en/experience/marugame-kyudo-club/)
                grep -Eqi '^content-type:.*text/html' "$headers" &&
                  grep -Fq '<title>Marugame High School Kyudo Club | Takumi Tokunaga</title>' "$body" &&
                  grep -Fq '<link rel="canonical" href="https://takumi-tokunaga.com/en/experience/marugame-kyudo-club/"' "$body" &&
                  grep -Fq 'marugame-kyudo-club_practice.jpg' "$body" &&
                  ! grep -Fq 'marugame-kyudo-club_farewell' "$body"
                ;;
              /robots.txt)
                grep -Eqi '^content-type:.*(text/plain|text/)' "$headers" &&
                  grep -Fq 'User-agent: *' "$body" &&
                  grep -Fq 'Sitemap: https://takumi-tokunaga.com/sitemap.xml' "$body"
                ;;
              /sitemap.xml)
                grep -Eqi '^content-type:.*(application/xml|text/xml)' "$headers" &&
                  grep -Fq '<urlset ' "$body" &&
                  grep -Fq '<loc>https://takumi-tokunaga.com/</loc>' "$body"
                ;;
            esac
          }

          routes=(
            /
            /experience/rione/
            /en/experience/rione/
            /experience/marugame-kyudo-club/
            /en/experience/marugame-kyudo-club/
            /robots.txt
            /sitemap.xml
          )
          for route in "${routes[@]}"; do
            url="${PORTFOLIO_SITE_ORIGIN}${route}"
            echo "Checking ${url}"
            for attempt in 1 2 3 4 5; do
              headers="${scratch_dir}/headers-${attempt}"
              body="${scratch_dir}/body-${attempt}"
              if curl --fail --silent --show-error --location --max-time 20 --dump-header "$headers" --output "$body" "$url" &&
                verify_response "$route" "$headers" "$body"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Production smoke check failed for ${url}"
                exit 1
              fi
              sleep $((attempt * 3))
            done
          done

          verify_retired_path() {
            local label="$1" retired_path="$2"
            local attempt headers metrics status content_type cache_control header_hash header_size http_hops
            local curl_status curl_type curl_bytes

            for attempt in 1 2 3 4 5; do
              headers="${scratch_dir}/retired-${label}-headers-${attempt}"
              metrics="${scratch_dir}/retired-${label}-metrics-${attempt}"
              # Preserve the requested spelling and do not follow redirects:
              # every first hop must itself be the tombstone. The GET body is
              # discarded and never written to an artifact.
              curl --silent --show-error --path-as-is --globoff --max-time 20 --dump-header "$headers" \
                --write-out '%{http_code}|%{content_type}|%{size_download}\n' --output /dev/null \
                "${PORTFOLIO_SITE_ORIGIN}${retired_path}" > "$metrics" || true
              status="$(awk '/^HTTP\// { value=$2 } END { print value }' "$headers")"
              http_hops="$(awk '/^HTTP\// { count += 1 } END { print count + 0 }' "$headers")"
              # A transport failure can leave write-out empty. Keep parsing
              # non-fatal so the bounded retry loop, rather than `set -e`,
              # decides whether the production check has failed.
              IFS='|' read -r curl_status curl_type curl_bytes < "$metrics" || true
              content_type="$(awk 'BEGIN { IGNORECASE=1 } /^content-type:/ { value=$0 } END { print value }' "$headers")"
              cache_control="$(awk 'BEGIN { IGNORECASE=1 } /^cache-control:/ { value=$0 } END { print value }' "$headers")"
              header_hash="$(shasum -a 256 "$headers" | awk '{ print $1 }')"
              header_size="$(wc -c < "$headers" | tr -d ' ')"
              printf 'path=%s attempt=%s status=%s hops=%s content_type=%s cache_control=%s header_sha256=%s header_bytes=%s curl=%s\n' \
                "$label" "$attempt" "$status" "$http_hops" "$content_type" "$cache_control" "$header_hash" "$header_size" \
                "$(tr '\n' ' ' < "$metrics")" >> smoke-diagnostics/retired-asset.txt
              if [ "$status" = "410" ] && [ "$curl_status" = "410" ] && [ "$http_hops" = "1" ] &&
                [ "$curl_bytes" = "0" ] &&
                grep -Eqi '^cache-control:.*no-store.*max-age=0|^cache-control:.*max-age=0.*no-store' "$headers" &&
                ! grep -Eqi '^content-type:.*image/' "$headers"; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            return 1
          }

          retired_paths=(
            'rione-canonical|/images/experience/rione/rione_expo_pass.JPG'
            "rione-query|/images/experience/rione/rione_expo_pass.JPG?retired_check=${GITHUB_SHA}"
            'rione-repeated-slash|//images//experience/rione//rione_expo_pass.JPG'
            'rione-percent-encoded|/%69mages%2Fexperience%2Frione%2Frione_expo_pass%2EJPG'
            'rione-case-variant|/IMAGES/EXPERIENCE/RIONE/RIONE_EXPO_PASS.jpg'
            'kyudo-webp-canonical|/images/experience/marugame-kyudo-club/marugame-kyudo-club_farewell.webp'
            "kyudo-webp-query|/images/experience/marugame-kyudo-club/marugame-kyudo-club_farewell.webp?retired_check=${GITHUB_SHA}"
            'kyudo-webp-repeated-slash|//images//experience//marugame-kyudo-club//marugame-kyudo-club_farewell.webp'
            'kyudo-webp-percent-encoded|/%69mages%2Fexperience%2Fmarugame-kyudo-club%2Fmarugame-kyudo-club_farewell%2Ewebp'
            'kyudo-webp-case-variant|/IMAGES/EXPERIENCE/MARUGAME-KYUDO-CLUB/MARUGAME-KYUDO-CLUB_FAREWELL.WEBP'
            'kyudo-png-legacy|/images/experience/marugame-kyudo-club/marugame-kyudo-club_farewell.png'
          )
          for retired_case in "${retired_paths[@]}"; do
            label="${retired_case%%|*}"
            retired_path="${retired_case#*|}"
            if ! verify_retired_path "$label" "$retired_path"; then
              echo "::error::Retired asset spelling '${label}' remains retrievable or has incorrect tombstone headers"
              exit 1
            fi
          done

          verify_known_good_image() {
            local label="$1" image_path="$2"
            local headers="${scratch_dir}/known-good-${label}-headers"
            local metrics="${scratch_dir}/known-good-${label}-metrics"
            local known_good_status known_good_type known_good_bytes

            curl --fail --silent --show-error --path-as-is --globoff --max-time 20 --dump-header "$headers" \
              --write-out '%{http_code}|%{content_type}|%{size_download}\n' --output /dev/null \
              "${PORTFOLIO_SITE_ORIGIN}${image_path}?control=${GITHUB_SHA}" > "$metrics"
            IFS='|' read -r known_good_status known_good_type known_good_bytes < "$metrics"
            if [ "$known_good_status" != "200" ] || [[ "$known_good_type" != image/* ]] || [ "$known_good_bytes" -le 0 ]; then
              echo "::error::Known-good image control '${label}' failed"
              return 1
            fi
            if ! grep -Eqi '^cache-control:.*public' "$headers" ||
              ! grep -Eqi '^cache-control:.*max-age=604800' "$headers" ||
              ! grep -Eqi '^cache-control:.*stale-while-revalidate=86400' "$headers" ||
              grep -Eqi '^cache-control:.*max-age=0([^0-9]|$)' "$headers" ||
              [ "$(grep -Eic '^cache-control:' "$headers")" -ne 1 ]; then
              echo "::error::Known-good image cache contract '${label}' changed"
              return 1
            fi
            printf 'status=%s content_type=%s bytes=%s header_sha256=%s\n' \
              "$known_good_status" "$known_good_type" "$known_good_bytes" \
              "$(shasum -a 256 "$headers" | awk '{ print $1 }')" \
              > "smoke-diagnostics/known-good-image-${label}.txt"
          }

          verify_known_good_image 'rione' '/images/experience/rione/rione_expo_discription.webp'
          verify_known_good_image 'kyudo-practice' \
            '/images/experience/marugame-kyudo-club/marugame-kyudo-club_practice.jpg'
      - name: Upload production smoke diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-smoke-diagnostics
          path: smoke-diagnostics
          if-no-files-found: warn
          retention-days: 7
